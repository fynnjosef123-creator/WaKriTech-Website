<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Selection AI Abonnement | WaKriTech</title>
  <style>
    :root { color-scheme:dark; --bg:#0c1118; --panel:#111923; --line:#2a3544; --ink:#f4f7fb; --muted:#a7b2c2; --accent:#6ea2ff; --success:#48c78e; }
    * { box-sizing:border-box; } body { min-height:100vh; display:grid; place-items:center; margin:0; padding:24px; background:var(--bg); color:var(--ink); font:15px/1.55 Inter,system-ui,-apple-system,"Segoe UI",sans-serif; }
    main { width:min(620px,100%); border:1px solid var(--line); border-radius:8px; padding:32px; background:var(--panel); }
    .mark { width:40px; height:40px; display:grid; place-items:center; border:1px solid var(--line); border-radius:7px; color:var(--accent); font-weight:850; }
    h1 { margin:24px 0 10px; font-size:34px; line-height:1.12; letter-spacing:0; } p { margin:0; color:var(--muted); }
    .status { margin:22px 0; padding:13px 14px; border-left:3px solid var(--accent); background:#0d1520; }
    .status.success { border-color:var(--success); color:#b9f1d5; }
    a { min-height:44px; display:inline-flex; align-items:center; justify-content:center; border:1px solid var(--line); border-radius:7px; padding:0 16px; color:var(--ink); text-decoration:none; font-weight:720; }
  </style>
</head>
<body>
  <main>
    <div class="mark">AI</div>
    <h1 id="title">Zahlung wird bestätigt</h1>
    <p>Selection AI prüft den Status direkt bei Stripe. Erst danach wird der Tarif für dein Konto freigeschaltet.</p>
    <div id="status" class="status">Bitte einen Moment warten ...</div>
    <a href="/pricing.html">Zu den Tarifen</a>
  </main>
  <script>
    const API_URL = new URLSearchParams(window.location.search).get("api")
      || "https://selection-ai-api.onrender.com";
    const sessionId = new URLSearchParams(location.search).get("session_id") || "";
    let session = null;
    try { session = JSON.parse(sessionStorage.getItem("selection_ai_web_session") || "null"); } catch {}
    const statusEl = document.getElementById("status");
    const titleEl = document.getElementById("title");

    async function verify() {
      if (!session?.token || !sessionId) {
        titleEl.textContent = "Checkout abgeschlossen";
        statusEl.textContent = "Öffne Selection AI und aktualisiere unter Einstellungen > Abo & Nutzung. Der Tarif wird automatisch synchronisiert.";
        return;
      }
      for (let attempt = 0; attempt < 10; attempt += 1) {
        try {
          const response = await fetch(`${API_URL}/v1/billing/status?session_id=${encodeURIComponent(sessionId)}`, {
            headers: { Authorization:`Bearer ${session.token}` }
          });
          const payload = await response.json().catch(() => ({}));
          if (!response.ok) throw new Error(payload.error || "Status konnte nicht geprüft werden.");
          if (payload.billing?.active && !["free", "beta"].includes(payload.billing?.planId)) {
            titleEl.textContent = "Abonnement aktiv";
            statusEl.classList.add("success");
            statusEl.textContent = `Der Tarif ${payload.usage?.plan?.name || payload.billing.planId} ist jetzt für dein Konto freigeschaltet.`;
            return;
          }
        } catch (error) {
          if (attempt === 9) statusEl.textContent = error.message;
        }
        await new Promise((resolve) => setTimeout(resolve, 2500));
      }
      titleEl.textContent = "Bestätigung läuft noch";
      statusEl.textContent = "Stripe verarbeitet das Abonnement noch. Selection AI aktualisiert den Tarif automatisch.";
    }
    verify();
  </script>
</body>
</html>
