    <text x="108" y="602" fill="#AEB9C9" font-size="14" font-weight="700">WAS SOLL DIESES TOOL ERLEDIGEN?</text><rect x="108" y="620" width="875" height="64" rx="7" fill="#0E151E" stroke="#334155" stroke-width="2"/><text x="127" y="658" fill="#D8E5F9" font-size="17">Verträge auf Risiken, Fristen und fehlende Angaben prüfen.</text>
