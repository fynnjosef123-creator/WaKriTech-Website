    <text x="82" y="368" fill="#AEB9C9" font-size="15" font-weight="700">BESCHREIBUNG</text><rect x="82" y="386" width="928" height="60" rx="8" fill="#0E151E" stroke="#334155" stroke-width="2"/><text x="103" y="424" fill="#AEB9C9" font-size="17">Prüft Klauseln, Fristen und mögliche Risiken.</text>
